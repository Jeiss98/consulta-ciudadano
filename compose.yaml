services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootDemo2026_local}
      MYSQL_DATABASE: consulta_ciudadano
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-permissions.sql:/docker-entrypoint-initdb.d/02-permissions.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  defensa:
    build: .
    command: ["node", "src/defense-mock.js"]
    environment:
      DEFENSE_API_KEY: defensa-solo-demo
    ports:
      - "127.0.0.1:4001:4001"
  correo:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  app:
    build: .
    command: ["sh", "-c", "npm run db:seed && npm start"]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_NAME: consulta_ciudadano
      DB_USER: cc_app
      DB_PASSWORD: CcLocal2026_demo
      DEFENSE_URL: http://defensa:4001/validar
      DEFENSE_API_KEY: defensa-solo-demo
      SMTP_HOST: correo
      SMTP_PORT: 1025
      MAIL_FROM: registro@consulta.example
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2026}
    depends_on:
      mysql:
        condition: service_healthy
      defensa:
        condition: service_started
      correo:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  proxy:
    image: caddy:2.10
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
